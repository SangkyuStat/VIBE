    intro: >-
      저희는 통계 방법론을 개발하고 이를 실제 데이터에 적용합니다. 생존분석, 고차원 통계, 분위수 회귀, 베이지안 모형, 머신러닝 등을 연구하며,
      이를 보건, 생명과학, 환경 분야의 문제에 활용합니다. 대부분의 연구는 실제 질문에서 시작해, 누구나 쓸 수 있는
      소프트웨어 패키지로 마무리됩니다.
