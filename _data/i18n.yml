ko:
  toggle: "English"
  toggle_short: "EN"
  toggle_label: "이 페이지를 영어로 보기"
  home:
    explore: "연구 둘러보기"
    about_title: "연구실 소개"
    about_lead: >-
      VIBE는 건국대학교 응용통계학과의 통계 및 데이터사이언스 연구실입니다. 평균 너머 데이터의 변동에 주목하며,
      생존분석, 인과추론, 고차원 통계, 분위수 회귀, 베이지안 모형, 머신러닝 등을 연구하고, 이를 보건, 노화, 환경 분야의 실제 문제에 적용합니다.
    methods_title: "방법론"
    methods_text: "생존분석, 고차원 통계, 분위수 회귀, 베이지안 모형, 머신러닝을 연구하며, 이론적 근거도 함께 다룹니다."
    apps_title: "응용"
    apps_text: "암 역학, 노화와 알츠하이머병, 영양과 대사체, 기후 극값 같은 실제 문제를 다양한 방법론들을 활용하여 풀고 있습니다."
    software_title: "소프트웨어"
    software_text: "개발한 방법들은 패키지 형태로 공개해, 누구나 자신의 데이터에 쓸 수 있게 합니다."
