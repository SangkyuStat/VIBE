  research:
    intro: >-
      분위수 회귀가 저희 연구실의 주요 분야이긴 하지만, 그것이 전부는 아닙니다. 생존분석, 고차원 데이터, 베이지안 모형도 연구하며,
      보건, 노화, 환경 분야의 공동연구자들과 함께 실제 문제에 적용합니다. 대부분의 연구는 실제 질문에서 시작해, 누구나 쓸 수 있는
      소프트웨어 패키지로 마무리됩니다.
    learn_more: "자세히 보기"
    software_text: "경쟁위험 회귀부터 닫힌 형태 추정량, 표본선택 모형까지, 개발한 방법을 소프트웨어 패키지로 공개합니다."
