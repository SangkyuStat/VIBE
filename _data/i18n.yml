    about_lead: >-
      We are a statistics research group in the Department of Applied Statistics at Konkuk University.
      Quantile regression is one of our strengths, but our interests reach well beyond it: survival analysis,
      causal inference, high-dimensional and Bayesian models, and machine learning, together with real problems
      in health, aging, and the environment.
