    about_lead: >-
      We are a statistics and data science research group in the Department of Applied Statistics at Konkuk University.
      We look beyond averages to the variation in data, working on survival analysis, causal inference, high-dimensional
      statistics, quantile regression, Bayesian models, and machine learning, with applications in health, aging, and
      the environment.
